name: ApexKitBLE
options:
  bundleIdPrefix: com.randallknutson
  deploymentTarget:
    iOS: "6.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  ApexKitBLE:
    type: framework
    platform: iOS
    sources:
      - path: ApexKitBLE
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randallknutson.ApexKitBLE
        INFOPLIST_FILE: ApexKitBLE/Info.plist
        WRAPPER_EXTENSION: framework
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        ENABLE_BITCODE: NO

  ApexKitBLEPlugin:
    type: framework
    platform: iOS
    sources:
      - path: ApexKitBLEPlugin
        type: group
    dependencies:
      - target: ApexKitBLE
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randallknutson.ApexKitBLEPlugin
        INFOPLIST_FILE: ApexKitBLEPlugin/Info.plist
        WRAPPER_EXTENSION: framework
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        ENABLE_BITCODE: NO
