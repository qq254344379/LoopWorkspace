name: EmbectaKitBLE
options:
  bundleIdPrefix: com.randallknutson
  deploymentTarget:
    iOS: "6.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  EmbectaKitBLE:
    type: framework
    platform: iOS
    sources:
      - path: EmbectaKitBLE
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randallknutson.EmbectaKitBLE
        INFOPLIST_FILE: EmbectaKitBLE/Info.plist
        WRAPPER_EXTENSION: framework
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        ENABLE_BITCODE: NO

  EmbectaKitBLEPlugin:
    type: framework
    platform: iOS
    sources:
      - path: EmbectaKitBLEPlugin
        type: group
    dependencies:
      - target: EmbectaKitBLE
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randallknutson.EmbectaKitBLEPlugin
        INFOPLIST_FILE: EmbectaKitBLEPlugin/Info.plist
        WRAPPER_EXTENSION: framework
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        ENABLE_BITCODE: NO
